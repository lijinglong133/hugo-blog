<main class="main">
<div class="post-content" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <h1>搜索</h1>
  <input 
    type="text" 
    id="searchInput" 
    placeholder="输入关键词搜索文章..." 
    style="width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;"
  >
  <div id="searchResults" style="margin-top: 24px;"></div>
</div>

<script>
const searchInput = document.getElementById('searchInput');
const resultBox = document.getElementById('searchResults');
let allPosts = [];


async function loadIndex() {
  try {
    const res = await fetch('/hugo-blog/index.json');
    allPosts = await res.json();
  } catch (err) {
    resultBox.innerHTML = '<p style="color:red">搜索索引加载失败</p>';
    console.error(err);
  }
}


function searchPosts(keyword) {
  const kw = keyword.toLowerCase();
  return allPosts.filter(post => {
    const title = (post.title || '').toLowerCase();
    const summary = (post.summary || '').toLowerCase();
    const content = (post.content || '').toLowerCase();
    return title.includes(kw) || summary.includes(kw) || content.includes(kw);
  });
}


function renderResults(list) {
  if (!list.length) {
    resultBox.innerHTML = '<p style="opacity:.7">未找到相关内容</p>';
    return;
  }
  let html = '<ul style="list-style:none;padding:0">';
  list.slice(0, 20).forEach(item => {
    const title = item.title || '无标题';
    const link = item.permalink || '#';
    const summary = item.summary || '暂无摘要';
    html += `<li style="margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid #eee;">
      <a href="${link}" style="font-size: 18px; text-decoration: none; color: var(--primary);">${title}</a>
      <p style="opacity:.8; font-size: 14px; margin: 6px 0; line-height: 1.5;">${summary.slice(0, 100)}...</p>
    </li>`;
  });
  html += '</ul>';
  resultBox.innerHTML = html;
}

// 实时监听输入
searchInput.addEventListener('input', e => {
  const kw = e.target.value.trim();
  if (!kw) {
    resultBox.innerHTML = '';
    return;
  }
  const results = searchPosts(kw);
  renderResults(results);
});

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', loadIndex);
</script>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
